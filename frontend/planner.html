<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Travel Planner | EcoPath AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex z-10">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-green-600">EcoPath AI</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>📊</span> Dashboard
            </a>
            <a href="planner.html" class="flex items-center gap-3 px-4 py-3 bg-green-50 text-green-700 rounded-xl font-medium transition-colors">
                <span>🗺️</span> Travel Planner
            </a>
            <a href="log.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>📝</span> Log Activity
            </a>
            <a href="scoreboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>🏆</span> Scoreboard
            </a>
            <a href="chat.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>🤖</span> Chat Assistance
            </a>
        </nav>
        <div class="p-4 border-t border-gray-200">
            <button id="logoutBtn" class="flex w-full items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl font-medium transition-colors">
                <span>🚪</span> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        
        <!-- Mobile Header (Visible only on small screens) -->
        <header class="md:hidden bg-white shadow-sm border-b border-gray-200 h-16 flex items-center justify-between px-4 shrink-0">
            <h1 class="text-xl font-bold text-green-600">EcoPath AI</h1>
            <button id="mobileMenuBtn" class="text-gray-600 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>

        <!-- Main Scrollable Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-3xl mx-auto">
                <div class="bg-white rounded-2xl shadow-sm p-8 mb-8 border border-gray-100">
                    <h2 class="text-2xl font-bold text-gray-900 mb-2">Carbon-Aware Travel Planner</h2>
                    <p class="text-gray-500 mb-6">Find the greenest, fastest, or cheapest way to your destination.</p>
                    
                    <form id="travelForm" class="space-y-4">
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Source</label>
                                <input type="text" id="source" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors" placeholder="E.g., Home" required>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Destination</label>
                                <input type="text" id="destination" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors" placeholder="E.g., Office" required>
                            </div>
                            <div class="md:col-span-2">
                                <label class="block text-sm font-medium text-gray-700 mb-1">Estimated Distance (km) - Auto-filled by Maps API later</label>
                                <input type="number" id="distance" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition-colors" placeholder="Distance in km" required>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-green-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-green-700 transition-colors mt-4">
                            Compare Options
                        </button>
                    </form>
                </div>

                <!-- Results Section (Hidden initially) -->
                <div id="resultsSection" class="hidden space-y-6">
                    <h3 class="text-xl font-bold text-gray-900 mb-4">Available Routes</h3>
                    <div id="optionsContainer" class="space-y-4">
                        <!-- Dynamic Options Injected Here -->
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="js/planner.js"></script>
</body>
</html>
