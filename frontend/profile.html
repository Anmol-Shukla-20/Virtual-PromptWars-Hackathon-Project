<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | EcoPath AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex z-10">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-green-600">EcoPath AI</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>📊</span> Dashboard
            </a>
            <a href="planner.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>🗺️</span> Travel Planner
            </a>
            <a href="log.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>📝</span> Log Activity
            </a>
            <a href="scoreboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>🏆</span> Scoreboard
            </a>
            <a href="chat.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>🤖</span> Chat Assistance
            </a>
        </nav>
        <div class="p-4 border-t border-gray-200">
            <button id="logoutBtn" class="flex w-full items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl font-medium transition-colors">
                <span>🚪</span> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content Area -->
    <div class="flex-1 flex flex-col overflow-hidden">
        
        <!-- Mobile Header (Visible only on small screens) -->
        <header class="md:hidden bg-white shadow-sm border-b border-gray-200 h-16 flex items-center justify-between px-4 shrink-0">
            <h1 class="text-xl font-bold text-green-600">EcoPath AI</h1>
            <div class="flex items-center gap-3">
                <button id="mobileMenuBtn" class="text-gray-600 focus:outline-none">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                </button>
            </div>
        </header>

        <!-- Desktop Header -->
        <header class="hidden md:flex bg-white h-16 items-center justify-end px-8 shrink-0 z-40 relative">
            <div class="flex items-center gap-4">
                <div class="relative">
                    <button id="profileDropdownBtn" class="flex items-center gap-2 bg-white border border-gray-300 rounded-full pl-1 pr-3 py-1 hover:shadow-md transition-all focus:outline-none">
                        <div id="userAvatarInitial" class="w-8 h-8 rounded-full bg-green-700 text-white flex items-center justify-center font-bold text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                        </div>
                        <svg class="w-5 h-5 text-green-800" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
                    </button>
                    
                    <!-- Dropdown Menu -->
                    <div id="profileDropdown" class="hidden absolute right-0 mt-3 w-56 bg-white rounded-2xl shadow-xl border border-gray-100 py-3 z-50 transform origin-top-right transition-all">
                        <a href="dashboard.html" class="flex items-center gap-3 px-5 py-2.5 text-gray-700 hover:bg-gray-50 transition-colors">
                            <svg class="w-5 h-5 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
                            <span class="font-medium text-[15px]">Dashboard</span>
                        </a>
                        <a href="scoreboard.html" class="flex items-center gap-3 px-5 py-2.5 text-gray-700 hover:bg-gray-50 transition-colors border-b border-gray-100 pb-4 mb-2">
                            <svg class="w-5 h-5 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4M7.835 4.697a3.42 3.42 0 001.946-.806 3.42 3.42 0 014.438 0 3.42 3.42 0 001.946.806 3.42 3.42 0 013.138 3.138 3.42 3.42 0 00.806 1.946 3.42 3.42 0 010 4.438 3.42 3.42 0 00-.806 1.946 3.42 3.42 0 01-3.138 3.138 3.42 3.42 0 00-1.946.806 3.42 3.42 0 01-4.438 0 3.42 3.42 0 00-1.946-.806 3.42 3.42 0 01-3.138-3.138 3.42 3.42 0 00-.806-1.946 3.42 3.42 0 010-4.438 3.42 3.42 0 00.806-1.946 3.42 3.42 0 013.138-3.138z"></path></svg>
                            <span class="font-medium text-[15px]">Achievements</span>
                        </a>
                        <a href="profile.html" class="flex items-center gap-3 px-5 py-2.5 bg-green-50 text-green-800 transition-colors">
                            <svg class="w-5 h-5 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                            <span class="font-medium text-[15px]">Profile</span>
                        </a>
                        <button id="dropdownLogoutBtn" class="w-full flex items-center gap-3 px-5 py-2.5 text-green-800 hover:bg-green-50 transition-colors mt-1 border-t border-gray-100 pt-2">
                            <svg class="w-5 h-5 text-green-700" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
                            <span class="font-medium text-[15px]">Sign Out</span>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Scrollable Area -->
        <main class="flex-1 overflow-y-auto p-4 sm:p-6 lg:p-8">
            <div class="max-w-2xl mx-auto">
                <h1 class="text-4xl font-light text-gray-900 mb-8">Profile</h1>
                
                <form id="profileForm" class="space-y-8">
                    <!-- About You Section -->
                    <section>
                        <h2 class="text-sm font-semibold text-gray-600 mb-4 tracking-wide uppercase">About you</h2>
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-0 border-b border-gray-200">
                                <!-- Name -->
                                <div class="p-4 border-b md:border-b-0 md:border-r border-gray-200 hover:bg-gray-50 transition-colors">
                                    <label class="block text-xs font-medium text-gray-500 mb-1">Full Name</label>
                                    <input type="text" id="profName" class="w-full bg-transparent text-gray-900 font-medium focus:outline-none text-lg" placeholder="Enter your name">
                                </div>
                                <!-- Gender -->
                                <div class="p-4 hover:bg-gray-50 transition-colors">
                                    <label class="block text-xs font-medium text-gray-500 mb-1">Gender</label>
                                    <select id="profGender" class="w-full bg-transparent text-gray-900 font-medium focus:outline-none text-lg cursor-pointer">
                                        <option value="">Select gender</option>
                                        <option value="Male">Male</option>
                                        <option value="Female">Female</option>
                                        <option value="Other">Other</option>
                                    </select>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-0 border-b border-gray-200">
                                <!-- Birthday -->
                                <div class="p-4 border-b md:border-b-0 md:border-r border-gray-200 hover:bg-gray-50 transition-colors">
                                    <label class="block text-xs font-medium text-gray-500 mb-1">Birthday</label>
                                    <input type="date" id="profDob" class="w-full bg-transparent text-gray-900 font-medium focus:outline-none text-lg cursor-pointer">
                                </div>
                                <!-- Age (Auto-calculated) -->
                                <div class="p-4 bg-gray-50">
                                    <label class="block text-xs font-medium text-gray-500 mb-1">Age</label>
                                    <div id="profAge" class="w-full text-gray-500 font-medium text-lg pt-1">--</div>
                                </div>
                            </div>

                            <div class="grid grid-cols-1 md:grid-cols-2 gap-0">
                                <!-- Weight -->
                                <div class="p-4 border-b md:border-b-0 md:border-r border-gray-200 hover:bg-gray-50 transition-colors">
                                    <label class="block text-xs font-medium text-gray-500 mb-1">Weight</label>
                                    <div class="flex items-center">
                                        <input type="number" id="profWeight" step="0.1" class="w-full bg-transparent text-gray-900 font-medium focus:outline-none text-lg" placeholder="0.0">
                                        <span class="text-gray-400 font-medium">kg</span>
                                    </div>
                                </div>
                                <!-- Height -->
                                <div class="p-4 hover:bg-gray-50 transition-colors">
                                    <label class="block text-xs font-medium text-gray-500 mb-1">Height</label>
                                    <div class="flex items-center">
                                        <input type="number" id="profHeight" class="w-full bg-transparent text-gray-900 font-medium focus:outline-none text-lg" placeholder="0">
                                        <span class="text-gray-400 font-medium">cm</span>
                                    </div>
                                </div>
                            </div>

                        </div>
                    </section>

                    <!-- Eco Goals Section -->
                    <section>
                        <h2 class="text-sm font-semibold text-gray-600 mb-4 tracking-wide uppercase">Activity goals</h2>
                        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-0">
                                <!-- Target CO2 Reduction -->
                                <div class="p-4 border-b md:border-b-0 md:border-r border-gray-200 hover:bg-gray-50 transition-colors">
                                    <label class="block text-xs font-medium text-gray-500 mb-1">Target Monthly CO₂ Reduction</label>
                                    <div class="flex items-center">
                                        <input type="number" id="profGoalCo2" class="w-full bg-transparent text-gray-900 font-medium focus:outline-none text-lg" placeholder="50">
                                        <span class="text-gray-400 font-medium">kg</span>
                                    </div>
                                </div>
                                <!-- Daily Points Goal -->
                                <div class="p-4 hover:bg-gray-50 transition-colors">
                                    <label class="block text-xs font-medium text-gray-500 mb-1">Daily EcoPoints Goal</label>
                                    <div class="flex items-center">
                                        <input type="number" id="profGoalPts" class="w-full bg-transparent text-gray-900 font-medium focus:outline-none text-lg" placeholder="100">
                                        <span class="text-gray-400 font-medium">pts</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </section>

                    <!-- Save Button -->
                    <div class="flex items-center justify-between pt-4">
                        <div id="saveFeedback" class="text-sm font-medium text-green-600 opacity-0 transition-opacity">Profile saved successfully!</div>
                        <button type="submit" class="bg-green-600 text-white font-medium px-6 py-2 rounded-full hover:bg-green-700 transition-colors shadow-sm">
                            Save changes
                        </button>
                    </div>
                </form>

            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/profile.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
