<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoBot Chat | EcoPath AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-800 font-sans antialiased h-screen flex overflow-hidden">

    <!-- Sidebar -->
    <aside class="w-64 bg-white border-r border-gray-200 flex flex-col hidden md:flex z-10">
        <div class="h-16 flex items-center px-6 border-b border-gray-200">
            <h1 class="text-2xl font-bold text-green-600">EcoPath AI</h1>
        </div>
        <nav class="flex-1 px-4 py-6 space-y-2 overflow-y-auto">
            <a href="dashboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>📊</span> Dashboard
            </a>
            <a href="planner.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>🗺️</span> Travel Planner
            </a>
            <a href="log.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>📝</span> Log Activity
            </a>
            <a href="scoreboard.html" class="flex items-center gap-3 px-4 py-3 text-gray-600 hover:bg-gray-50 hover:text-green-600 rounded-xl font-medium transition-colors">
                <span>🏆</span> Scoreboard
            </a>
            <a href="chat.html" class="flex items-center gap-3 px-4 py-3 bg-green-50 text-green-700 rounded-xl font-medium transition-colors">
                <span>🤖</span> Chat Assistance
            </a>
        </nav>
        <div class="p-4 border-t border-gray-200">
            <button id="logoutBtn" class="flex w-full items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 rounded-xl font-medium transition-colors">
                <span>🚪</span> Logout
            </button>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden bg-white">
        <header class="md:hidden bg-white shadow-sm border-b border-gray-200 h-16 flex items-center justify-between px-4 shrink-0">
            <h1 class="text-xl font-bold text-green-600">EcoPath AI</h1>
            <button id="mobileMenuBtn" class="text-gray-600 focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
            </button>
        </header>

        <!-- Chat Header -->
        <div class="h-16 border-b border-gray-200 flex items-center px-6 shrink-0 bg-white">
            <div class="w-10 h-10 rounded-full bg-green-100 flex items-center justify-center text-xl mr-3">🤖</div>
            <div>
                <h2 class="font-bold text-gray-900">EcoBot</h2>
                <p class="text-xs text-green-600 flex items-center"><span class="w-2 h-2 rounded-full bg-green-500 mr-1"></span>Online - AI Sustainability Coach</p>
            </div>
        </div>

        <!-- Chat Messages -->
        <div id="chatMessages" class="flex-1 overflow-y-auto p-6 space-y-6 bg-gray-50">
            
            <!-- Bot Message -->
            <div class="flex items-start">
                <div class="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center text-sm mr-3 shrink-0">🤖</div>
                <div class="bg-white border border-gray-200 rounded-2xl rounded-tl-none p-4 shadow-sm max-w-[80%]">
                    <p class="text-sm text-gray-800">Hi there! I'm EcoBot. I can analyze your footprint and give you personalized tips to reduce your emissions. How can I help you today?</p>
                </div>
            </div>

            <!-- Example suggestions -->
            <div class="flex flex-wrap gap-2 ml-11">
                <button class="suggestion-btn text-xs bg-green-50 text-green-700 border border-green-200 px-3 py-1.5 rounded-full hover:bg-green-100 transition-colors">How can I reduce my footprint?</button>
                <button class="suggestion-btn text-xs bg-green-50 text-green-700 border border-green-200 px-3 py-1.5 rounded-full hover:bg-green-100 transition-colors">What contributes most to my emissions?</button>
            </div>

        </div>

        <!-- Chat Input -->
        <div class="p-4 bg-white border-t border-gray-200 shrink-0">
            <form id="chatForm" class="flex items-end gap-2 max-w-4xl mx-auto">
                <div class="flex-1 bg-gray-50 border border-gray-200 rounded-2xl overflow-hidden focus-within:border-green-500 focus-within:ring-1 focus-within:ring-green-500 transition-all">
                    <textarea id="chatInput" rows="1" class="w-full bg-transparent border-0 focus:ring-0 resize-none p-3 text-sm text-gray-800" placeholder="Ask EcoBot a question..."></textarea>
                </div>
                <button type="submit" class="bg-green-600 text-white p-3 rounded-2xl hover:bg-green-700 transition-colors flex items-center justify-center shrink-0 disabled:opacity-50">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/search.js"></script>
</body>
</html>
